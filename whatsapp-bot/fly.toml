# Fly.io config for the Project Eleven WhatsApp bot.
# Deploy from this directory with: fly launch --copy-config  (then: fly deploy)
app = "project11-whatsapp-bot"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
